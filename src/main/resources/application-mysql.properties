spring.application.name=RentGuard

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rentguard?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:local_dev_only_change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
rentguard.jwt.secret=${JWT_SECRET:dGVzdC1vbmx5LXJlbnRndWFyZC1qd3Qta2V5LWNoYW5nZS1tZQ==}
rentguard.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
