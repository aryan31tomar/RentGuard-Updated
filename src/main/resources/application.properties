spring.application.name=RentGuard

# Server Port
server.port=8080

# Default Database: H2 in-memory (runs out of the box with zero setup)
spring.sql.init.mode=never
spring.datasource.url=jdbc:h2:mem:rentguard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration (Base64 encoded 256-bit secret)
rentguard.jwt.secret=${JWT_SECRET:dGVzdC1vbmx5LXJlbnRndWFyZC1qd3Qta2V5LWNoYW5nZS1tZQ==}
rentguard.jwt.expiration-ms=86400000

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
